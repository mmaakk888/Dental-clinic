<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجهيز خادم العيادة</title><link rel="stylesheet" href="setup.css"><main><h1>تجهيز العيادة مرة واحدة</h1><p>ابدأ بقاعدة جديدة فارغة بعد إنشاء الجداول وضبط الاتصال. يُنشأ حساب المدير فقط، بلا مرضى أو معاملات أو حسابات تجريبية، ويُغلق المُثبّت تلقائيًا بعد نجاحه.</p><form id="setup"><label>رمز التهيئة الخاص<input name="installToken" type="password" required autocomplete="off"></label><label>اسم الطبيب أو المدير<input name="name" required maxlength="100"></label><label>اسم الدخول<input name="username" required autocomplete="username" maxlength="60"></label><label>البريد الإلكتروني<input name="email" type="email" autocomplete="email"></label><label>كلمة السر — من ١٢ إلى ٧٢ بايت<input name="password" type="password" required minlength="12" autocomplete="new-password"></label><label>تأكيد كلمة السر<input name="confirmation" type="password" required minlength="12" autocomplete="new-password"></label><button disabled>إنشاء حساب المدير</button></form><p id="status" role="status" aria-live="polite">جارٍ فحص حالة التثبيت…</p><a href="./">فتح العيادة</a></main><script src="setup.js"></script></html>
